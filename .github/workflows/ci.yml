name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    name: Branch + commit conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Head branch is type/slug
        run: |
          branch='${{ github.head_ref }}'
          if ! printf '%s' "$branch" | grep -qE '^(feat|feature|bugfix|fix|hotfix|release|chore)/[a-z0-9]+([.-][a-z0-9]+)*$'; then
            echo "::error::branch '$branch' must match type/slug per Conventional Branch —"
            echo "(feat|feature|bugfix|fix|hotfix|release|chore)/lowercase-hyphen-slug"
            exit 1
          fi
      - name: PR title is a Conventional Commit subject, ASCII-only
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$PR_TITLE" | grep -qE '^(feat|fix|refactor|docs|chore|test|ci|perf)\([a-z0-9._/-]+\)!?: [a-z0-9].{0,70}$'; then
            echo "::error::PR title must match type(scope): summary, <=72 chars"
            exit 1
          fi
          if printf '%s' "$PR_TITLE" | LC_ALL=C grep -q '[^ -~]'; then
            echo "::error::PR title must be ASCII-only (non-ASCII detail goes in the body)"
            exit 1
          fi
          echo "PR title ok"
      - name: Commit subjects are Conventional Commits, ASCII-only
        run: |
          bad=0
          while IFS= read -r subj; do
            if ! printf '%s' "$subj" | grep -qE '^(feat|fix|refactor|docs|chore|test|ci|perf)\([a-z0-9._/-]+\)!?: [a-z0-9].{0,70}$'; then
              echo "::error::non-conventional subject (want type(scope): summary, <=72 chars): $subj"
              bad=1
            fi
            if printf '%s' "$subj" | LC_ALL=C grep -q '[^ -~]'; then
              echo "::error::non-ASCII subject (non-ASCII detail goes in the body instead): $subj"
              bad=1
            fi
          done < <(git log --no-merges --format='%s' '${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}')
          if [ "$bad" -eq 0 ]; then echo "commit subjects ok"; fi
          exit "$bad"

  verify:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
